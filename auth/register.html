<div class="container">
  <h1>DAFTAR AKUN</h1>
  <div class="alert alert-err" id="alert-err"></div>

  <form id="form-register" class="form-wrap">
    <label>Nama Lengkap *</label>
    <input type="text" name="nama" required placeholder="Nama kamu">
    <label>Email *</label>
    <input type="email" name="email" required placeholder="email@example.com">
    <label>Password * (min. 6 karakter)</label>
    <input type="password" name="password" required placeholder="••••••••">
    <label>Konfirmasi Password *</label>
    <input type="password" name="confirm" required placeholder="Ulangi password">
    <button type="submit">Daftar Sekarang</button>
  </form>

  <p style="font-size:.85rem;margin-top:16px;color:#555">
    Sudah punya akun? <a href="login.html" style="color:#cc0000">Login di sini</a>
  </p>
</div>

<footer>&copy; 2026 DonasiKita — UKL SIJA 2026</footer>

</body>
</html>
