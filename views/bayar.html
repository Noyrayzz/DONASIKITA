<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form Donasi — DonasiKita</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<nav>
  <a href="../index.html" class="nav-logo">DONASIKITA</a>
  <ul class="nav-links">
    <li><a href="../index.html">BERANDA</a></li>
    <li><a href="katalog.html">DONASI</a></li>
    <ul id="nav-right" style="display:contents"></ul>
  </ul>
</nav>

<div class="container">
  <div class="breadcrumb"><a href="../index.html">Beranda</a> / <a href="katalog.html">Katalog</a> / Form Donasi</div>
  <h1>FORM DONASI</h1>

  <p style="font-size:.88rem;color:#555;margin-bottom:4px">Program:</p>
  <p style="font-weight:bold;color:#cc0000;margin-bottom:8px" id="b-judul">—</p>

  <div class="progress-bar" style="max-width:460px"><div class="progress-fill" id="b-prog" style="width:0%"></div></div>
  <p style="font-size:.8rem;color:#888;margin:4px 0 20px">
    <span id="b-amount">—</span> terkumpul &nbsp;·&nbsp; <span id="b-pct">0%</span> dari <span id="b-target">—</span>
  </p>

  <div class="alert alert-err" id="alert-err"></div>

  <form id="form-bayar" class="form-wrap">
    <label>Nama Donatur</label>
    <input type="text" id="inp-nama" placeholder="Nama kamu / Hamba Allah">

    <label>Jumlah Donasi (Rp) *</label>
    <input type="number" id="inp-jumlah" min="1000" placeholder="Contoh: 50000" required>
    <div class="quick">
      <button type="button" data-v="10000">Rp 10.000</button>
      <button type="button" data-v="25000">Rp 25.000</button>
      <button type="button" data-v="50000">Rp 50.000</button>
      <button type="button" data-v="100000">Rp 100.000</button>
      <button type="button" data-v="250000">Rp 250.000</button>
      <button type="button" data-v="500000">Rp 500.000</button>
    </div>

    <label>Metode Pembayaran *</label>
    <div class="pay-opts">
      <label><input type="radio" name="metode" value="GoPay" checked> <span>💚 GoPay</span></label>
      <label><input type="radio" name="metode" value="OVO">   <span>💜 OVO</span></label>
      <label><input type="radio" name="metode" value="DANA">  <span>💙 DANA</span></label>
      <label><input type="radio" name="metode" value="Transfer"> <span>🏦 Transfer Bank</span></label>
    </div>

    <label>Pesan / Doa (opsional)</label>
    <textarea id="inp-pesan" placeholder="Semoga bermanfaat..."></textarea>

    <p style="font-size:.83rem;color:#888;margin-top:12px">Total donasi: <strong id="preview-jml">—</strong></p>

    <button type="submit">Konfirmasi &amp; Donasi Sekarang</button>
    &nbsp;
    <a href="#" id="back-btn" class="btn btn-outline" style="display:inline-block;margin-top:16px">Batal</a>
  </form>
</div>

<footer>&copy; 2026 DonasiKita — UKL SIJA 2026</footer>
<script src="../assets/js/script.js"></script>
<script>initBayar();</script>
</body>
</html>
